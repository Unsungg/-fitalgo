<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitalgo — AI Coach</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .hero { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 40px 0; }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .chat-box { height: 450px; overflow-y: auto; padding: 16px; background: #f8f9fa; border-radius: 12px; }
        .msg-user { background: #667eea; color: white; border-radius: 16px 16px 4px 16px; padding: 10px 16px; max-width: 75%; margin-left: auto; margin-bottom: 12px; }
        .msg-ai { background: white; color: #333; border-radius: 16px 16px 16px 4px; padding: 10px 16px; max-width: 75%; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .btn-primary { background: #667eea; border: none; border-radius: 8px; }
        .btn-primary:hover { background: #764ba2; }
        .typing { color: #999; font-style: italic; font-size: 13px; padding: 8px; }
    </style>
</head>
<body>
    <div class="hero text-center">
        <h1 class="fw-bold">Fitalgo AI Coach</h1>
        <p class="lead">Ask me anything about fitness and nutrition!</p>
    </div>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-4">

                    <!-- Chat messages -->
                    <div class="chat-box" id="chatBox">
                        <div class="msg-ai">
                            Hi {{ current_user.name }}! 👋 I'm your personal AI fitness coach. Ask me anything about your workout, nutrition, or fitness goals!
                        </div>
                    </div>

                    <div id="typingIndicator" class="typing" style="display:none;">AI Coach is typing...</div>

                    <!-- Input area -->
                    <div class="d-flex gap-2 mt-3">
                        <input type="text" id="userInput" class="form-control" placeholder="e.g. How do I do a proper squat?" onkeypress="handleKey(event)">
                        <button class="btn btn-primary px-4" onclick="sendMessage()">Send</button>
                    </div>

                    <!-- Quick questions -->
                    <div class="mt-3">
                        <p class="text-muted small mb-2">Quick questions:</p>
                        <div class="d-flex flex-wrap gap-2">
                            <button class="btn btn-outline-secondary btn-sm" onclick="quickAsk('How many calories should I eat to lose weight?')">Calorie intake</button>
                            <button class="btn btn-outline-secondary btn-sm" onclick="quickAsk('What is the best exercise for building chest muscles?')">Best chest exercises</button>
                            <button class="btn btn-outline-secondary btn-sm" onclick="quickAsk('How much protein do I need per day?')">Daily protein</button>
                            <button class="btn btn-outline-secondary btn-sm" onclick="quickAsk('How do I do a proper squat?')">Proper squat form</button>
                        </div>
                    </div>

                    <div class="mt-3 text-center">
                        <a href="/dashboard" class="btn btn-outline-secondary btn-sm">Back to Dashboard</a>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        function handleKey(event) {
            if (event.key === 'Enter') sendMessage();
        }

        function quickAsk(question) {
            document.getElementById('userInput').value = question;
            sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            // Show user message
            appendMessage(message, 'user');
            input.value = '';

            // Show typing indicator
            document.getElementById('typingIndicator').style.display = 'block';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await response.json();
                document.getElementById('typingIndicator').style.display = 'none';
                appendMessage(data.reply, 'ai');
            } catch (error) {
                document.getElementById('typingIndicator').style.display = 'none';
                appendMessage('Sorry, something went wrong. Please try again.', 'ai');
            }
        }

        function appendMessage(text, sender) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = sender === 'user' ? 'msg-user' : 'msg-ai';
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
